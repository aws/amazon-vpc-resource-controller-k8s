name: VPC Limits No Removal Check
on:
  pull_request:
    paths:
      - "pkg/aws/vpc/limits.go"
permissions:
  contents: read
jobs:
  check-no-removal:
    name: Ensure no instance types were removed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Check that pkg/aws/vpc/limits.go only gains instance types
        run: |
          ./scripts/check_vpc_limits_no_removal.sh "origin/${{ github.event.pull_request.base.ref }}" pkg/aws/vpc/limits.go
