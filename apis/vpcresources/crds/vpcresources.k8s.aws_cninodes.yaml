---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: cninodes.vpcresources.k8s.aws
spec:
  group: vpcresources.k8s.aws
  names:
    kind: CNINode
    listKind: CNINodeList
    plural: cninodes
    shortNames:
    - cnd
    singular: cninode
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - description: The features delegated to VPC resource controller
      jsonPath: .spec.features
      name: Features
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              Important: Run "make" to regenerate code after modifying this file
              CNINodeSpec defines the desired state of CNINode
            properties:
              features:
                items:
                  description: Feature is a type of feature being supported by VPC
                    resource controller and other AWS Services
                  properties:
                    name:
                      description: FeatureName is a type of feature name supported
                        by AWS VPC CNI. It can be Security Group for Pods, custom
                        networking, or others
                      type: string
                    value:
                      type: string
                  type: object
                type: array
              managedBy:
                description: |-
                  ManagedBy identifies the controller that owns this CNINode and its
                  status. Empty is equivalent to "vpc-resource-controller" for backward
                  compatibility with objects created before this field existed.
                  Controllers must ignore CNINodes managed by another controller.
                  Immutable once set: a node can never legitimately change between
                  compute types, so a managedBy flip is always a bug or tampering.
                  Setting it on an existing object that has never had a value remains
                  allowed (adoption of pre-existing objects).
                enum:
                - vpc-resource-controller
                - eks-auto-mode
                type: string
                x-kubernetes-validations:
                - message: managedBy is immutable once set
                  rule: self == oldSelf
              tags:
                additionalProperties:
                  type: string
                description: Additional tag key/value added to all network interfaces
                  provisioned by the vpc-resource-controller and VPC-CNI
                type: object
            type: object
            x-kubernetes-validations:
            - message: managedBy cannot be removed once set
              rule: '!has(oldSelf.managedBy) || has(self.managedBy)'
          status:
            description: CNINodeStatus defines the managed VPC resources.
            properties:
              reinitCheckpoint:
                description: |-
                  ReinitCheckpoint is the vpc-resource-controller-private restart-recovery
                  checkpoint: the instance fields needed to rebuild in-memory state on
                  controller restart or leader change without synchronous EC2 describes.
                  Written only by the vpc-resource-controller; other controllers must
                  neither write nor depend on it.
                properties:
                  instance:
                    description: Instance stores the EC2 instance fields needed on
                      hydrate.
                    properties:
                      connectionTracking:
                        description: ConnectionTrackingStatus stores primary ENI connection
                          tracking settings.
                        properties:
                          tcpEstablishedTimeout:
                            format: int32
                            type: integer
                          udpStreamTimeout:
                            format: int32
                            type: integer
                          udpTimeout:
                            format: int32
                            type: integer
                        type: object
                      currentInstanceSecurityGroups:
                        items:
                          type: string
                        type: array
                      currentSubnetCIDRBlock:
                        type: string
                      currentSubnetID:
                        type: string
                      currentSubnetV6CIDRBlock:
                        type: string
                      instanceID:
                        type: string
                      instanceSubnetCIDRBlock:
                        type: string
                      instanceSubnetID:
                        type: string
                      instanceSubnetV6CIDRBlock:
                        type: string
                      instanceType:
                        type: string
                      primaryNetworkInterfaceID:
                        type: string
                      primaryNetworkInterfaceSecurityGroups:
                        items:
                          type: string
                        type: array
                      subnetMask:
                        type: string
                      subnetV6Mask:
                        type: string
                    type: object
                  lastUpdated:
                    description: |-
                      LastUpdated records when the snapshot was last persisted; useful for
                      staleness debugging, deliberately excluded from drift comparison.
                    format: date-time
                    type: string
                  snapshotVersion:
                    description: |-
                      SnapshotVersion guards format skew: it is bumped whenever the snapshot
                      layout changes so old snapshots cleanly miss and are rewritten.
                    type: string
                type: object
              trunkInterface:
                description: |-
                  TrunkInterface describes the trunk network interface attached to the
                  node and the branch interfaces associated with it, persisted by the
                  managing controller (see spec.managedBy) for visibility and recovery.
                  This is the layer shared with other CNINode status writers (e.g. the
                  EKS Auto Mode controllers, which additionally populate Branches).
                properties:
                  branches:
                    description: |-
                      Branches are the branch ENIs associated with this trunk ENI.
                      Listed as a map keyed by id so distinct field managers can own
                      individual entries under Server-Side Apply without conflicting.
                    items:
                      description: BranchInterface describes a branch ENI associated
                        with a trunk ENI.
                      properties:
                        associationID:
                          description: AssociationID is the id of the association
                            between the branch and trunk ENI.
                          type: string
                        id:
                          description: ID is the EC2 network interface id of the branch
                            ENI.
                          minLength: 1
                          type: string
                        ipv4CIDRs:
                          description: |-
                            IPv4CIDRs are the IPv4 addresses or prefixes assigned to the branch ENI,
                            in CIDR notation (a single address is expressed as a /32).
                          items:
                            type: string
                          type: array
                          x-kubernetes-list-type: atomic
                        ipv6CIDRs:
                          description: |-
                            IPv6CIDRs are the IPv6 addresses or prefixes assigned to the branch ENI,
                            in CIDR notation (a single address is expressed as a /128).
                          items:
                            type: string
                          type: array
                          x-kubernetes-list-type: atomic
                        macAddress:
                          description: MacAddress is the MAC address of the branch
                            ENI.
                          type: string
                        securityGroups:
                          description: SecurityGroups are the security group ids attached
                            to the branch ENI.
                          items:
                            type: string
                          type: array
                          x-kubernetes-list-type: atomic
                        subnetCIDR:
                          description: SubnetCIDR is the IPv4 CIDR block of the subnet
                            the branch ENI belongs to.
                          type: string
                        subnetV6CIDR:
                          description: SubnetV6CIDR is the IPv6 CIDR block of the
                            subnet the branch ENI belongs to.
                          type: string
                        vlanID:
                          description: VlanID is the vlan id of the trunk-to-branch
                            association.
                          format: int32
                          type: integer
                      required:
                      - id
                      - vlanID
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - id
                    x-kubernetes-list-type: map
                  deviceIndex:
                    description: DeviceIndex is the attachment device index of the
                      trunk ENI on the instance.
                    format: int32
                    type: integer
                  id:
                    description: ID is the EC2 network interface id of the trunk ENI.
                    minLength: 1
                    type: string
                  macAddress:
                    description: MacAddress is the MAC address of the trunk ENI.
                    type: string
                  securityGroups:
                    description: SecurityGroups are the security group ids attached
                      to the trunk ENI.
                    items:
                      type: string
                    type: array
                    x-kubernetes-list-type: atomic
                  subnetID:
                    description: |-
                      SubnetID is the id of the subnet the trunk ENI belongs to. The
                      vpc-resource-controller's hydrate path validates it against the
                      instance subnet to reject stale snapshots after a subnet change.
                    type: string
                required:
                - id
                type: object
            type: object
        type: object
    selectableFields:
    - jsonPath: .spec.managedBy
    served: true
    storage: true
    subresources:
      status: {}
